<div class="flex flex-col items-center justify-center ">

  <span class="mb-2">
    el valor actual del contador es <b>{{ contador }}</b>
  </span>
  <input type="number" #number class="border rounded border-collapse self-center mb-2"/>
  <button class="border rounded p-1 mb-2" (click)="changeValue(number.value)">Cambiar valor</button>  
  <button class="border rounded p-1 mb-2" (click)="set0()">volver a 0</button>
  <div>
  <button class="border rounded p-1 mb-2 w-10 h-10" (click)="addOne()">+1</button>
  @if (contador > 0) {
  
    <button class="border rounded p-1 mb-2 mx-2 w-10 h-10" (click)="restOne()">-1</button>
    
  }
  </div>
</div>
