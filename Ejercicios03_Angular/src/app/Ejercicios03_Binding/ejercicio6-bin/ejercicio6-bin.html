<div class="flex flex-col items-center justify-center ">
  <form>
  <label for="operacion">Elige la operación:</label>
  <select class="border rounded mx-2" id="operacion" [(ngModel)]="operacion" name="operacion">
    <option value="suma">Suma (+)</option>
    <option value="resta">Resta (-)</option>
    <option value="multiplicacion">Multiplicación (×)</option>
    <option value="division">División (÷)</option>
    <option value="modulo">Módulo (%)</option>
  </select>
  <br><br>
  <div class="flex items-center justify-center">
    <input type="number" class="border rounded w-10 h-10 text-center" [(ngModel)]="numero1" placeholder="Número 1" name="numero1">
    <input type="number" class="border rounded w-10 h-10 mx-2  text-center" [(ngModel)]="numero2" placeholder="Número 2" name="numero2">
  </div>

  <div class="flex items-center justify-center m-4">
  <button type="button" class="self-center border rounded cursor-pointer bg-gray-200 hover:bg-gray-400 " (click)="Calculadora(operacion, numero1, numero2)">Calcular</button>
  </div>
<div class="flex items-center justify-center ">
  <span>El resultado es {{resultado}}</span>
</div>
</form>
</div>
