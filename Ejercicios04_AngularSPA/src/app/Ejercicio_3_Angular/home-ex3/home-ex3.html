<section id="servicios" class="h-screen bg-blue-300 flex flex-col items-center text-center">
  <h2 class="text-4xl md:text-5xl font-bold text-gray-600 mb-10 m-5">Usuarios</h2>
  
  <div class="mb-8">
    <a
      [routerLink]="['/cuenta-usuario']"
      class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:shadow-xl transition duration-200 transform hover:-translate-y-1"
    >
      👤 Ir a Mi Cuenta de Usuario
    </a>
  </div>

  <div class="flex flex-wrap justify-center">
    @for (usuario of usuarios; track usuario.id) {
      <a
        [routerLink]="['/cuenta-usuario', usuario.id, 'profile']"
        class="bg-white rounded-2xl shadow-lg p-8 m-2 w-full max-w-xs hover:-translate-y-1 hover:shadow-2xl cursor-pointer transition duration-200 block"
      >
        <div class="text-5xl mb-4">🧑‍💼</div>
        <h3 class="text-xl font-semibold text-gray-800 mb-2">Usuario {{ usuario.id }}</h3>
        <p class="text-gray-500 leading-relaxed">id= {{ usuario.id }} | Nombre= {{ usuario.nombre }} | Ciudad= {{ usuario.ciudad }}</p>
      </a>
    }
  </div>
</section>
