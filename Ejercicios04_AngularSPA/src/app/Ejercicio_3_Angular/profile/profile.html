@if (usuario) {
  <div class="w-full max-w-3xl mx-auto mt-6 p-6 bg-white rounded-xl shadow">
    <div class="flex items-center space-x-4 mb-6">
      <div class="w-14 h-14 flex items-center justify-center rounded-full bg-gray-200 dark:bg-gray-700 text-3xl">
        👤
      </div>
      <div class="flex space-x-10">
        <h2 class="text-2xl font-semibold ">Mi Perfil</h2>
      </div>
    </div>

    <div class="space-y-8">
      <!-- Información Personal -->
      <div>
        <h3 class="text-xl font-semibold mb-4">Información Personal</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-gray-600 dark:text-gray-400 block">Nombre:</label>
            <span class="font-medium">{{ usuario.nombre }}</span>
          </div>
          <div>
            <label class="text-gray-600 dark:text-gray-400 block">Email:</label>
            <span class="font-medium">{{ usuario.email }}</span>
          </div>
          <div>
            <label class="text-gray-600 dark:text-gray-400 block">Teléfono:</label>
            <span class="font-medium">{{ usuario.telefono }}</span>
          </div>
          <div>
            <label class="text-gray-600 dark:text-gray-400 block">Fecha de Nacimiento:</label>
            <span class="font-medium">{{ usuario.fechaNacimiento }}</span>
          </div>
        </div>
      </div>

      <!-- Dirección -->
      <div>
        <h3 class="text-xl font-semibold mb-4">Dirección</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="sm:col-span-2">
            <label class="text-gray-600 dark:text-gray-400 block">Calle:</label>
            <span class="font-medium">{{ usuario.calle }}</span>
          </div>
          <div>
            <label class="text-gray-600 dark:text-gray-400 block">Ciudad:</label>
            <span class="font-medium">{{ usuario.ciudad }}</span>
          </div>
          <div>
            <label class="text-gray-600 dark:text-gray-400 block">Código Postal:</label>
            <span class="font-medium">{{ usuario.codigoPostal }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
} @else {
  <div class="w-full max-w-lg mx-auto mt-6 p-6 bg-white dark:bg-gray-900 rounded-xl shadow text-center">
    <p class="text-lg">Cargando información del usuario...</p>
  </div>
}
