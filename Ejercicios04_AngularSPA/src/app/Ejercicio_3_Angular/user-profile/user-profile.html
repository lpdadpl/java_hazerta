<div class="bg-gray-300 flex items-start justify-center min-h-screen">
  <div class="w-full max-w-6xl bg-white shadow-2xl rounded-lg p-8 mt-5">
    <h1 class="text-3xl font-extrabold text-custom-blue mb-8 text-center border-b pb-4">
      Gestión de Cuenta de Usuario
    </h1>

    <div class="flex flex-col lg:flex-row gap-8">
      <nav class="lg:w-1/4 shrink-0 p-4 border-r lg:border-r-0 border-gray-200">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">Navegación</h2>
        <div class="space-y-4">
          <a
            [routerLink]="['./profile']"
            routerLinkActive="bg-blue-600 text-white shadow-md"
            class="w-full p-3 rounded-lg text-left font-medium text-gray-800 bg-gray-50 hover:bg-blue-500 hover:text-white transition duration-200 flex items-center group"
          >
            <span class="text-xl mr-3 group-hover:text-white">👤</span>
            Perfil
          </a>

          <a
            [routerLink]="['./settings']"
            routerLinkActive="bg-blue-600 text-white shadow-md"
            class="w-full p-3 rounded-lg text-left font-medium text-gray-800 bg-gray-50 hover:bg-blue-500 hover:text-white transition duration-200 flex items-center group"
          >
            <span class="text-xl mr-3 group-hover:text-white">⚙️</span>
            Configuración
          </a>

          <a
            [routerLink]="['./history']"
            routerLinkActive="bg-blue-600 text-white shadow-md"
            class="w-full p-3 rounded-lg text-left font-medium text-gray-800 bg-gray-50 hover:bg-blue-500 hover:text-white transition duration-200 flex items-center group"
          >
            <span class="text-xl mr-3 group-hover:text-white">🛒</span>
            Historial de Compras
          </a>
        </div>
      </nav>

      <main class="lg:w-3/4 p-4">
        <h2 class="text-2xl font-semibold mb-6 text-gray-700 border-b pb-2">
          Contenido de la Sección
        </h2>
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
